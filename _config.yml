locale: en-US
site_theme: default
title: Junteng Liu
title_separator: '-'
name: Junteng Liu
description: 'Research in NLP, LLM reasoning, truthfulness, and interpretability.'
url: https://emyhamid.github.io
baseurl: /academicpages.github.io
repository: emyhamid/academicpages.github.io
author:
  avatar: https://github.com/Vicent0205.png
  name: Junteng Liu
  bio: 'Ph.D. student in Computer Science, HKUST NLP Group'
  employer: Hong Kong University of Science and Technology
  email: jliugi@connect.ust.hk
  googlescholar: https://scholar.google.com/citations?user=tbK9jl4AAAAJ
  github: Vicent0205
  twitter: junteng88716710
breadcrumbs: false
words_per_minute: 160
future: true
read_more: disabled
talkmap_link: false
comments:
  provider: false
atom_feed:
  hide: true
analytics:
  provider: 'false'
include: [.htaccess, _pages, files]
exclude:
  - '*.sublime-project'
  - '*.sublime-workspace'
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
  - AGENTS.md
  - _posts
  - _publications
  - _talks
  - _teaching
  - _portfolio
  - talkmap
  - talkmap.html
  - talkmap.ipynb
  - talkmap_out.ipynb
  - talkmap.py
  - markdown_generator
keep_files: [.git, .svn]
encoding: utf-8
markdown_ext: markdown,mkdown,mkdn,mkd,md
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: '\n\n'
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
# Only personal pages are published; upstream demonstrations stay in Git.
defaults:
  - scope:
      path: ''
      type: pages
    values:
      layout: single
      author_profile: true
      published: false
  - scope:
      path: _pages/about.md
    values:
      published: true
  - scope:
      path: _pages/404.md
    values:
      published: true
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Etc/UTC
plugins: [jekyll-feed, jekyll-gist, jekyll-paginate, jekyll-sitemap, jekyll-redirect-from, jemoji]
whitelist: [jekyll-feed, jekyll-gist, jekyll-paginate, jekyll-sitemap, jekyll-redirect-from, jemoji]
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
compress_html:
  clippings: all
  ignore:
    envs: development
